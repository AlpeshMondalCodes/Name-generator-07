<!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink Font Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#ffffff;
    color:#222;
    min-height:100vh;
}

.container{
    width:92%;
    max-width:850px;
    margin:auto;
    padding:35px 0;
}

/* HEADER */

header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    color:#ff1493;
}

.logo span{
    color:#ff1493;
}

.subtitle{
    color:#777;
    margin-top:8px;
}

/* TEXT INPUT */

textarea{
    width:100%;
    height:130px;
    resize:none;

    border:2px solid #ffd0e7;
    border-radius:16px;

    background:#fff;
    color:#222;

    padding:18px;
    font-size:18px;

    outline:none;
}

textarea:focus{
    border-color:#ff1493;
}

/* SEARCH */

.search{
    width:100%;
    margin:18px 0;

    padding:15px;

    border-radius:12px;
    border:2px solid #ffd0e7;

    background:#fff;
    color:#222;

    outline:none;
    font-size:15px;
}

.search:focus{
    border-color:#ff1493;
}

/* FONT LIST */

.font-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* FONT BOX */

.font-box{
    background:#fff;
    border:2px solid #f1f1f1;

    border-radius:14px;
    padding:17px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    box-shadow:0 4px 15px rgba(255,20,147,0.07);

    transition:.2s;
}

.font-box:hover{
    border-color:#ffb5d7;
    transform:translateY(-2px);
}

/* PREVIEW */

.preview{
    font-size:22px;
    word-break:break-word;
    flex:1;
    color:#222;
}

/* COPY BUTTON */

.copy-btn{
    border:0;

    background:#ff1493;
    color:#fff;

    padding:10px 15px;

    border-radius:9px;

    cursor:pointer;
    font-weight:bold;

    transition:.2s;
}

.copy-btn:hover{
    background:#e60082;
}

.copy-btn:active{
    transform:scale(.95);
}

/* EMPTY */

.empty{
    text-align:center;
    color:#999;
    padding:30px;
}

/* FOOTER */

footer{
    text-align:center;
    color:#999;

    margin-top:35px;

    font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:25px 0;
    }

    .logo{
        font-size:27px;
    }

    .font-box{
        align-items:flex-start;
        flex-direction:column;
    }

    .copy-btn{
        width:100%;
    }

    .preview{
        width:100%;
    }
}
</style>

</head>

<body>

<div class="container">

<header>

    <div class="logo">
        FONT <span>GENERATOR</span>
    </div>

    <div class="subtitle">
        Create stylish text instantly.
    </div>

</header>


<textarea
    id="textInput"
    placeholder="Type your text here..."
></textarea>


<input
    type="text"
    id="searchInput"
    class="search"
    placeholder="🔍 Search fonts..."
>


<div id="fontList" class="font-list"></div>


<footer>
    Made with ❤️ • Font Generator
</footer>

</div>


<script>

const fonts = [

{
    name:"Normal",
    transform:t=>t
},

{
    name:"Fullwidth",
    transform:t=>fullwidth(t)
},

{
    name:"Small Caps",
    transform:t=>smallCaps(t)
},

{
    name:"Circled",
    transform:t=>circled(t)
},

{
    name:"Squared",
    transform:t=>squared(t)
},

{
    name:"Parenthesized",
    transform:t=>parenthesized(t)
},

{
    name:"Math Bold",
    transform:t=>mathBold(t)
},

{
    name:"Math Italic",
    transform:t=>mathItalic(t)
},

{
    name:"Bold Italic",
    transform:t=>mathBoldItalic(t)
},

{
    name:"Monospace",
    transform:t=>mono(t)
},

{
    name:"Underline",
    transform:t=>underline(t)
},

{
    name:"Strike",
    transform:t=>strike(t)
},

{
    name:"Double",
    transform:t=>double(t)
},

{
    name:"Bubble",
    transform:t=>bubble(t)
},

{
    name:"Tiny",
    transform:t=>tiny(t)
},

{
    name:"Wide",
    transform:t=>t.split("").join(" ")
},

{
    name:"Reverse",
    transform:t=>t.split("").reverse().join("")
},

{
    name:"UPPERCASE",
    transform:t=>t.toUpperCase()
},

{
    name:"lowercase",
    transform:t=>t.toLowerCase()
},

{
    name:"Spaced",
    transform:t=>t.split("").join("  ")
}

];


/* CHARACTER MAPPER */

function mapChars(text,start){

    return [...text].map(c=>{

        let code=c.charCodeAt(0);

        if(code>=65 && code<=90){
            return String.fromCodePoint(
                start+(code-65)
            );
        }

        if(code>=97 && code<=122){
            return String.fromCodePoint(
                start+26+(code-97)
            );
        }

        return c;

    }).join("");

}


/* FULLWIDTH */

function fullwidth(t){

    return [...t].map(c=>{

        let code=c.charCodeAt(0);

        if(code>=33 && code<=126){
            return String.fromCharCode(
                code+65248
            );
        }

        if(c===" "){
            return "　";
        }

        return c;

    }).join("");

}


/* SMALL CAPS */

function smallCaps(t){

    const m={

        a:"ᴀ",b:"ʙ",c:"ᴄ",d:"ᴅ",
        e:"ᴇ",f:"ꜰ",g:"ɢ",h:"ʜ",
        i:"ɪ",j:"ᴊ",k:"ᴋ",l:"ʟ",
        m:"ᴍ",n:"ɴ",o:"ᴏ",p:"ᴘ",
        q:"ǫ",r:"ʀ",s:"s",t:"ᴛ",
        u:"ᴜ",v:"ᴠ",w:"ᴡ",x:"x",
        y:"ʏ",z:"ᴢ"

    };

    return [...t]
        .map(c=>m[c.toLowerCase()]||c)
        .join("");

}


/* CIRCLED */

function circled(t){

    const upper=
    "ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ";

    const lower=
    "ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩ";

    return [...t].map(c=>{

        if(c>="A" && c<="Z"){
            return upper[c.charCodeAt(0)-65];
        }

        if(c>="a" && c<="z"){
            return lower[c.charCodeAt(0)-97];
        }

        return c;

    }).join("");

}


/* SQUARED */

function squared(t){

    const chars=
    "🄰🄱🄲🄳🄴🄵🄶🄷🄸🄹🄺🄻🄼🄽🄾🄿🅀🅁🅂🅃🅄🅅🅆🅇🅈🅉";

    return [...t].map(c=>{

        if(c>="A" && c<="Z"){
            return chars[c.charCodeAt(0)-65];
        }

        return c;

    }).join("");

}


/* PARENTHESIZED */

function parenthesized(t){

    const chars=
    "⒜⒝⒞⒟⒠⒡⒢⒣⒤⒥⒦⒧⒨⒩⒪⒫⒬⒭⒮⒯⒰⒱⒲⒳⒴⒵";

    return [...t].map(c=>{

        if(c>="a" && c<="z"){
            return chars[c.charCodeAt(0)-97];
        }

        return c;

    }).join("");

}


/* MATH BOLD */

function mathBold(t){
    return mapChars(t,0x1D400);
}


/* MATH ITALIC */

function mathItalic(t){
    return mapChars(t,0x1D434);
}


/* BOLD ITALIC */

function mathBoldItalic(t){
    return mapChars(t,0x1D468);
}


/* MONOSPACE */

function mono(t){
    return mapChars(t,0x1D670);
}


/* UNDERLINE */

function underline(t){

    return [...t]
        .map(c=>c===" " ? " " : c+"̲")
        .join("");

}


/* STRIKE */

function strike(t){

    return [...t]
        .map(c=>c===" " ? " " : c+"̶")
        .join("");

}


/* DOUBLE */

function double(t){
    return mapChars(t,0x1D538);
}


/* BUBBLE */

function bubble(t){
    return circled(t);
}


/* TINY */

function tiny(t){

    const m={

        a:"ᵃ",b:"ᵇ",c:"ᶜ",d:"ᵈ",
        e:"ᵉ",f:"ᶠ",g:"ᵍ",h:"ʰ",
        i:"ⁱ",j:"ʲ",k:"ᵏ",l:"ˡ",
        m:"ᵐ",n:"ⁿ",o:"ᵒ",p:"ᵖ",
        q:"q",r:"ʳ",s:"ˢ",t:"ᵗ",
        u:"ᵘ",v:"ᵛ",w:"ʷ",x:"ˣ",
        y:"ʸ",z:"ᶻ"

    };

    return [...t]
        .map(c=>m[c.toLowerCase()]||c)
        .join("");

}


/* ELEMENTS */

const input=
document.getElementById("textInput");

const search=
document.getElementById("searchInput");

const list=
document.getElementById("fontList");


/* RENDER */

function render(){

    const text=
    input.value || "Your Text";

    const query=
    search.value.toLowerCase();

    list.innerHTML="";


    fonts
    .filter(font =>
        font.name
        .toLowerCase()
        .includes(query)
    )
    .forEach(font=>{

        const box=
        document.createElement("div");

        box.className="font-box";


        const preview=
        document.createElement("div");

        preview.className="preview";

        preview.textContent=
        font.transform(text);


        const button=
        document.createElement("button");

        button.className="copy-btn";

        button.textContent="COPY";


        button.onclick=()=>{

            const result=
            font.transform(text);

            navigator.clipboard
            .writeText(result);

            button.textContent=
            "COPIED ✓";


            setTimeout(()=>{

                button.textContent="COPY";

            },1200);

        };


        box.appendChild(preview);
        box.appendChild(button);

        list.appendChild(box);

    });


    if(!list.children.length){

        list.innerHTML=
        '<div class="empty">No fonts found.</div>';

    }

}


/* LIVE UPDATE */

input.addEventListener(
    "input",
    render
);

search.addEventListener(
    "input",
    render
);


/* START */

render();

</script>

</body>
</html>
